<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffdde1,#ee9ca7);
}

.container{
  background:#ffffff;
  padding:30px 25px;
  border-radius:20px;
  width:90%;
  max-width:400px;
  box-shadow:0 8px 25px rgba(0,0,0,0.15);
  text-align:center;
}

h1{
  margin-bottom:15px;
  color:#ff6f91;
}

input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #ffd6e0;
  margin-bottom:12px;
  font-size:14px;
  background:#fff5f7;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#ff6f91;
  color:white;
  font-size:15px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#ff4d79;
  transform:scale(1.05);
}

ol{
  margin-top:15px;
  text-align:left;
}

ol li{
  background:#ffe3ec;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
  font-size:14px;
  color:#444;
}

</style>
</head>
<body>

<div class="container">
<h1><i class="fa-solid fa-list-check"></i> Todo App</h1>

    <input type="text" placeholder="enter todo" id="input">
    <button onclick="addTodo()">Add Todo</button>
    <ol></ol>
</div>

  <script src="app.js"></script>
</body>

</html>
