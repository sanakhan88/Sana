<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: url('https://images.unsplash.com/photo-1499346030926-9a72daac6c63') no-repeat center center/cover;
  position:relative;
}

body::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
}

.card{
  position:relative;
  background:rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  padding:30px 25px;
  border-radius:20px;
  text-align:center;
  width:90%;
  max-width:380px;
  color:white;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.card h2{
  margin-bottom:15px;
  font-weight:600;
}

input{
  width:100%;
  padding:12px;
  margin:12px 0;
  border:none;
  border-radius:10px;
  outline:none;
  font-size:14px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#4facfe,#00f2fe);
  color:white;
  font-size:15px;
  cursor:pointer;
  transition:0.3s ease;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

#result{
  margin-top:15px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">
  <h2>☁ Weather App</h2>
  <input type="text" id="city" placeholder="Enter city name">
  <button onclick="getWeather()">Search</button>
  <div id="result"></div>
</div>



    <script src="app.js"></script>
</body>
</html>
