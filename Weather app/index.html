<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
</head>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background-image: url("https://images.unsplash.com/photo-1501630834273-4b5604d2ee31");
  background-size: cover;
  background-position: center;
  display: flex;
  justify-content: center;
  align-items: center;
}

.weather-app {
  background: rgba(0, 0, 0, 0.6);
  padding: 25px;
  border-radius: 15px;
  width: 90%;
  max-width: 400px;
  color: white;
  text-align: center;
}

.search-box {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}

.search-box input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

.search-box button {
  padding: 10px 15px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  background: #00c6ff;
}

.weather-info img {
  width: 80px;
  margin: 10px auto;
}

.weather-info h3 {
  font-size: 40px;
}

.weather-details {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.detail-card {
  background: rgba(255, 255, 255, 0.15);
  padding: 10px;
  border-radius: 10px;
  width: 33%;
}

.detail-card span {
  font-size: 14px;
  opacity: 0.8;
}

.detail-card p {
  font-size: 18px;
  font-weight: bold;
}

/* Mobile */
@media (max-width: 480px) {
  .weather-details {
    flex-direction: column;
  }
  .detail-card {
    width: 100%;
  }
}



</style>
<body>
     <div class="weather-app">
  <h1>🌦 Weather App</h1>

  <div class="search-box">
    <input type="text" id="cityInput" placeholder="Enter city name">
    <button id="searchBtn">🔍</button>
  </div>

  <div class="weather-info">
    <h2 id="city">City</h2>

    <img id="weatherIcon" alt="weather icon">

    <h3 id="temp">-- °C</h3>
    <p id="condition">Condition</p>

    <div class="weather-details">
      <div class="detail-card">
        <span>💧 Humidity</span>
        <p id="humidity">--%</p>
      </div>

      <div class="detail-card">
        <span>🌡 Feels Like</span>
        <p id="feelsLike">--°C</p>
      </div>

      <div class="detail-card">
        <span>🌬 Wind</span>
        <p id="wind">-- km/h</p>
      </div>
    </div>
  </div>
</div>


    <script src="app.js"></script>
</body>
</html>
