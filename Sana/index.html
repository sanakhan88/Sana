<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid layout</title>
    <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #2b2e56;
}
h1{
text-align: center;
color: white;
}
.Layout {
    margin: 30px 50px;
    padding: 10px;

    display: grid;
    gap: 15px;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 200px;

}

.child {
    border: 1px solid black;
}

#box-2 {
    grid-column: 2 / 4;
}

#box-1 {
    grid-column: 1 / 2;
    grid-row: 1 / 4;
}

#box-6 {
    grid-column: 4 / 5;
    grid-row: 2 / 4;
}

.red {
    background-color: #ec3437;
}

.green {
    background-color: #6dbe4f;
    
}

.yellow {
    background-color: #fbb22f;
}


@media(max-width: 1000px) {
    .container {
        grid-template-columns: repeat(1, 1fr);
    }


}
</style>
</head>

<body>
    <h1>Grid Layout</h1>
    <div class="Layout">
        <div class="child green" id="box-1"></div>
        <div class="child green" id="box-2"></div>
        <div class="child red" id="box-3"></div>
        <div class="child yellow" id="box-4"></div>
        <div class="child red" id="box-5"></div>
        <div class="child green" id="box-6"></div>
        <div class="child red" id="box-7"></div>
        <div class="child yellow" id="box-8"></div>
    </div>
</body>

</html>
