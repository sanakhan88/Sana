<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product</title>

 
</head>
<style>
   * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    padding: 20px;
    background: #f4f6f8;
}

h1 {
  background-color: rgb(248, 41, 41);
    text-align: center;
    margin-bottom: 30px;
    padding: 15px;
    font-size: 50px;
    color: white;
}

/* Buttons */

.btn {
background-color: purple;
margin-top: 15px;

}
.btn {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 10px 10px;
    margin-bottom: 20px ;
    cursor: pointer;
    border-radius: 5px;
    font-size: 20px;
    color: white;
}


.btn:hover {
    color: rgb(250, 13, 179);
}
.btn.active {
    background: #461dff;
}

/* Products */
.products {

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: rgb(9, 196, 25);
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.card h2 {
    margin-bottom: 10px;
    color: white;
}

.card p {
    margin: 5px 0;
    color: white;
}

.price {
    font-weight: bold;
    color: #007bff;
}
</style>
<body>
    <h1>My Product Project</h1>

<div class="btn"></div>

<div class="products" id="products"></div>


    <script src="app.js"></script>
</body>
</html>
